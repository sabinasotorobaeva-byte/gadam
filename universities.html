<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Университеты мира | QADAM</title>

<style>
*{box-sizing:border-box}
body{margin:0;background:#f7f5f0;color:#17243b;font-family:Arial,sans-serif}
header{background:#101d35;padding:22px 7%;display:flex;justify-content:space-between;align-items:center}
.logo{font-size:27px;letter-spacing:4px;color:#d5b779;font-weight:bold}
header a{color:white;text-decoration:none}
.hero{padding:80px 8%;background:linear-gradient(100deg,#101d35,#30476b);color:white}
.hero h1{font-family:Georgia,serif;font-size:clamp(38px,6vw,65px);margin:0 0 20px}
.hero p{max-width:650px;line-height:1.8;color:#e1e5ec}
main{max-width:1250px;margin:auto;padding:45px 25px}
h2{font-family:Georgia,serif;font-size:30px}
.filters{display:grid;grid-template-columns:2fr 1fr;gap:15px;margin:25px 0}
input,select{padding:16px;border:1px solid #d5d5d5;border-radius:7px;font-size:15px;width:100%;background:white}
.country{margin:45px 0}
.country-heading{display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid #d5b779;padding-bottom:12px}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:20px;margin-top:22px}
.card{background:white;border-radius:10px;padding:24px;border:1px solid #e8e3d9;display:flex;flex-direction:column;gap:13px}
.card h3{font-size:19px;margin:0;line-height:1.4}
.short{color:#a17d42;font-weight:bold}
.info{font-size:14px;color:#687386;line-height:1.7}
.tags{display:flex;flex-wrap:wrap;gap:7px}
.tag{background:#f1eee7;padding:7px 10px;border-radius:5px;font-size:12px}
.card a{margin-top:auto;color:#98743d;font-weight:bold;text-decoration:none;padding-top:10px}
.card a:hover{text-decoration:underline}
.count{font-size:13px;color:#777}
.empty{padding:40px;text-align:center;background:white;border-radius:10px}
footer{background:#101d35;color:white;text-align:center;padding:30px;margin-top:50px}
@media(max-width:650px){
.filters{grid-template-columns:1fr}
.hero{padding:55px 7%}
main{padding:30px 6%}
}
</style>
</head>

<body>

<header>
<div class="logo">QADAM</div>
<a href="index.html">← Главная</a>
</header>

<div class="hero">
<h1>Университеты мира</h1>
<p>Исследуй университеты разных стран, выбирай специальность и находи возможности финансирования своего образования.</p>
</div>

<main>

<h2>Каталог университетов</h2>

<div class="filters">
<input id="search" type="search" placeholder="Название, город или специальность">
<select id="country">
<option value="all">Все страны</option>
<option value="Кыргызстан">Кыргызстан</option>
<option value="Венгрия">Венгрия</option>
<option value="Великобритания">Великобритания</option>
</select>
</div>

<div id="catalog"></div>

</main>

<footer>QADAM — твой путь к международному образованию</footer>

<script>
const universities = [

{
country:"Кыргызстан",
name:"Кыргызская государственная медицинская академия",
short:"КГМА",
city:"Бишкек",
fields:["Лечебное дело","Педиатрия","Стоматология","Фармация"],
funding:"Государственный грант и контракт",
url:"https://kgma.kg/"
},
{
country:"Кыргызстан",
name:"Кыргызско-Российский Славянский университет",
short:"КРСУ",
city:"Бишкек",
fields:["Медицина","Инженерия","Экономика","Гуманитарные науки"],
funding:"Государственный грант и контракт",
url:"https://www.krsu.edu.kg/"
},
{
country:"Кыргызстан",
name:"Кыргызский национальный университет",
short:"КНУ",
city:"Бишкек",
fields:["Биология","Химия","Экономика","Право"],
funding:"Государственный грант и контракт",
url:"https://www.knu.kg/"
},
{
country:"Венгрия",
name:"Университет Земмельвейса",
short:"Semmelweis University",
city:"Будапешт",
fields:["Медицина","Стоматология","Фармация"],
funding:"Stipendium Hungaricum и контракт",
url:"https://semmelweis.hu/english/"
},
{
country:"Венгрия",
name:"Университет Сегеда",
short:"University of Szeged",
city:"Сегед",
fields:["Медицина","Стоматология","Фармация","Науки"],
funding:"Stipendium Hungaricum и контракт",
url:"https://u-szeged.hu/"
},
{
country:"Венгрия",
name:"Печский университет",
short:"University of Pécs",
city:"Печ",
fields:["Медицина","Стоматология","Фармация","Инженерия"],
funding:"Stipendium Hungaricum и контракт",
url:"https://international.pte.hu/"
},
{
country:"Великобритания",
name:"Оксфордский университет",
short:"University of Oxford",
city:"Оксфорд",
fields:["Медицина","Биология","Химия","Право"],
funding:"Университетские стипендии",
url:"https://www.ox.ac.uk/"
},
{
country:"Великобритания",
name:"Кембриджский университет",
short:"University of Cambridge",
city:"Кембридж",
fields:["Медицина","Биология","Химия","Инженерия"],
funding:"Университетские стипендии",
url:"https://www.cam.ac.uk/"
},
{
country:"Великобритания",
name:"Университетский колледж Лондона",
short:"UCL",
city:"Лондон",
fields:["Медицина","Биомедицина","Экономика","Инженерия"],
funding:"Университетские стипендии",
url:"https://www.ucl.ac.uk/"
}

];

const catalog=document.getElementById("catalog");
const search=document.getElementById("search");
const country=document.getElementById("country");

function render(){

catalog.innerHTML="";

const query=search.value.toLowerCase().trim();
const selected=country.value;

const filtered=universities.filter(u=>{

const text=[
u.name,
u.short,
u.city,
u.country,
...u.fields,
u.funding
].join(" ").toLowerCase();

return (selected==="all"||u.country===selected)
&&text.includes(query);

});

if(filtered.length===0){
catalog.innerHTML='<div class="empty">Университеты не найдены. Попробуй изменить запрос.</div>';
return;
}

const countries=[...new Set(filtered.map(u=>u.country))];

countries.forEach(c=>{

const section=document.createElement("section");
section.className="country";

const heading=document.createElement("div");
heading.className="country-heading";

const title=document.createElement("h2");
title.textContent=c;

const count=document.createElement("span");
count.className="count";
count.textContent=filtered.filter(u=>u.country===c).length+" университетов";

heading.append(title,count);

const cards=document.createElement("div");
cards.className="cards";

filtered.filter(u=>u.country===c).forEach(u=>{

const card=document.createElement("article");
card.className="card";

const name=document.createElement("h3");
name.textContent=u.name;

const short=document.createElement("div");
short.className="short";
short.textContent=u.short;

const city=document.createElement("div");
city.className="info";
city.textContent="📍 "+u.city+", "+u.country;

const tags=document.createElement("div");
tags.className="tags";

u.fields.forEach(f=>{
const tag=document.createElement("span");
tag.className="tag";
tag.textContent=f;
tags.appendChild(tag);
});

const funding=document.createElement("div");
funding.className="info";
funding.textContent="Финансирование: "+u.funding;

const link=document.createElement("a");
link.href=u.url;
link.target="_blank";
link.rel="noopener noreferrer";
link.textContent="Официальный сайт →";

card.append(name,short,city,tags,funding,link);
cards.appendChild(card);

});

section.append(heading,cards);
catalog.appendChild(section);

});

}

search.addEventListener("input",render);
country.addEventListener("change",render);

render();
</script>

</body>
</html>
