<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>QADAM — Твой путь к знаниям</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f7f8fc;
      color: #14213d;
    }
    header {
      padding: 25px 8%;
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: white;
    }
    .logo { font-size: 28px; font-weight: bold; color: #14213d; }
    .hero {
      text-align: center;
      padding: 100px 20px;
      background: #14213d;
      color: white;
    }
    .hero h1 { font-size: 48px; }
    .hero p { font-size: 19px; color: #d8deeb; }
    .button {
      display: inline-block;
      margin-top: 25px;
      padding: 15px 30px;
      background: #d6b46a;
      color: #14213d;
      text-decoration: none;
      border-radius: 6px;
      font-weight: bold;
    }
    section { padding: 55px 8%; text-align: center; }
    footer { padding: 25px; text-align: center; background: #14213d; color: white; }
  </style>
</head>
<body>
  <header>
    <div class="logo">QADAM.</div>
    <div>Образование без границ</div>
  </header>

  <main>
    <div class="hero">
      <h1>Твой следующий шаг начинается здесь.</h1>
      <p>Учись. Развивайся. Поступай в университет мечты.</p>
      <a href="#about" class="button">Начать путь</a>
    </div>

    <section id="about">
      <h2>Добро пожаловать в QADAM</h2>
      <p>Образовательная платформа, которая помогает ученикам открывать новые возможности.</p>
    </section>
  </main>

  <footer>© 2026 QADAM. Все права защищены.</footer>
</body>
</html>
